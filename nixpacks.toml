[phases.setup]
nixPkgs = ["python311"]
aptPkgs = ["python3-pip"]

[phases.install]
cmds = ["pip3 install -r minor/requirements.txt"]

[phases.build]
cmds = ["chmod +x build.sh", "./build.sh"]

[start]
cmd = "cd minor && gunicorn minor.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --max-requests 1000"
