android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# System JAVA_HOME (JDK 25) breaks Gradle 8.9's bundled Kotlin DSL compiler —
# it can't parse a "25" major version and the build fails with
# `java.lang.IllegalArgumentException: 25.0.2`. Pin to Android Studio's
# bundled JBR (JDK 21) instead. Update this path if Android Studio moves.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
