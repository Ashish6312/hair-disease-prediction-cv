        gap: 0.5rem;

        padding: 0.8rem 1.8rem;

        text-decoration: none;
        font-weight: 600;
        transition: all var(--transition-speed);
        border: none;
        cursor: pointer;

      }
      .btn-primary {

<div class="toast-container" id="toastContainer"></div>

<script>
  // Dropdown Logic
  document.addEventListener('DOMContentLoaded', () => {
    const trigger = document.getElementById('dropdownTrigger');
    const menu = document.getElementById('dropdownMenu');
    
    if (trigger && menu) {
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('show');
      });

      document.addEventListener('click', (e) => {
        if (!trigger.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove('show');
        }
      });
    }
  });

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    
    const iconMap = {
      success: 'fas fa-check-circle',
      error: 'fas fa-exclamation-circle',
      info: 'fas fa-info-circle'
    };
    
    toast.innerHTML = `
      <i class="${iconMap[type]}"></i>
      <span>${message}</span>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === "dark" ? "light" : "dark";
    body.dataset.theme = currentTheme;
    const icon = document.querySelector("#themeToggle i");
    if (icon) {
      icon.className = currentTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
    }
    localStorage.setItem("theme", currentTheme);
  }
  
  // Set theme on load
  document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "dark";
    document.body.dataset.theme = savedTheme;
    const icon = document.querySelector("#themeToggle i");
    if (icon) {
      icon.className = savedTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
    }
  });
</script>

  

    <main>
      <div class="form-card">
        <h1><i class="fas fa-user-plus"></i> Create Account</h1>

        <div class="alert alert-error" id="registerError" style="display:none;"></div>

        <form id="registerForm">
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" name="username" placeholder="Choose a username" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="regEmail">Gmail / Email</label>
            <input type="email" id="regEmail" name="email" placeholder="Enter your email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="regPassword1">Password</label>
            <input type="password" id="regPassword1" name="password1" placeholder="Create a password" required autocomplete="new-password" minlength="8" />
          </div>
          <div class="form-group">
            <label for="regPassword2">Confirm Password</label>
            <input type="password" id="regPassword2" name="password2" placeholder="Re-enter your password" required autocomplete="new-password" minlength="8" />
          </div>

          <button type="submit" class="btn btn-primary" id="registerBtn" style="margin-top: 1.5rem">
            Create Account <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="form-footer-link">
          <a href="login.html">Already have an account? Login</a>
        </div>
      </div>
    </main>

    <footer class="footer" id="contact">
      <div class="footer-content"></div>
      <div class="footer-bottom">
        <p>&copy; 2025 Hair &amp; Scalp Disease Prediction. All Rights Reserved.</p>
      </div>
    </footer>

    <script>
      const BACKEND = 'https://hair-scalp-backend.onrender.com';

      // Check if already logged in
      fetch(`${BACKEND}/check-auth`, { credentials: 'include' })
        .then(r => r.json())
        .then(data => {
          if (data.authenticated) {
            localStorage.setItem('user', JSON.stringify({ username: data.username, email: data.email, plan: data.plan }));
            window.location.href = 'index.html';
          }
        }).catch(() => {});

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('registerBtn');
        const errDiv = document.getElementById('registerError');
        errDiv.style.display = 'none';

        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password1 = document.getElementById('regPassword1').value;
        const password2 = document.getElementById('regPassword2').value;

        if (password1 !== password2) {
          errDiv.textContent = 'Passwords do not match.';
          errDiv.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

        try {
          const res = await fetch(`${BACKEND}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, email, password1, password2 })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('user', JSON.stringify({ username: data.username, email: data.email, plan: 'Free' }));
            showToast('Account created! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
          } else {
            errDiv.textContent = data.error || 'Registration failed. Please try again.';
            errDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
          }
        } catch (err) {
          errDiv.textContent = 'Connection error. Please try again.';
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
        }
      });
    </script>
