<script>
  // Dropdown Logic
  document.addEventListener('DOMContentLoaded', () => {
    const trigger = document.getElementById('dropdownTrigger');
    const menu = document.getElementById('dropdownMenu');

    if (trigger && menu) {
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('show');
      });

      document.addEventListener('click', (e) => {
        if (!trigger.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove('show');
        }
      });
    }

    // Mobile nav toggle
    const navToggle = document.getElementById('navToggle');
    const navMain = document.getElementById('navMain');
    if (navToggle && navMain) {
      const closeNav = () => {
        navMain.classList.remove('show');
        navToggle.setAttribute('aria-expanded', 'false');
        navToggle.querySelector('i').className = 'fas fa-bars';
      };
      navToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = navMain.classList.toggle('show');
        navToggle.setAttribute('aria-expanded', String(isOpen));
        navToggle.querySelector('i').className = isOpen ? 'fas fa-times' : 'fas fa-bars';
      });
      navMain.querySelectorAll('a').forEach(a => a.addEventListener('click', closeNav));
      document.addEventListener('click', (e) => {
        if (!navToggle.contains(e.target) && !navMain.contains(e.target)) closeNav();
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeNav();
      });
    }
  });

  // Auth-state Nav Sync — reflect real login state in the navbar (dropdown vs Login button)
  const AUTH_BACKEND = 'https://hair-scalp-backend.onrender.com';
  (function syncAuthNav() {
    const dropdown = document.getElementById('userDropdown');
    const loginBtn = document.querySelector('.login-btn');

    // Mobile Chrome frequently blocks the cross-site session cookie (3rd-party
    // cookie blocking), so login/register also hand back a bearer token that
    // we replay on every request as a fallback auth path.
    window.authFetch = function (url, opts = {}) {
      const token = localStorage.getItem('authToken');
      opts.credentials = 'include';
      opts.headers = Object.assign({}, opts.headers, token ? { 'Authorization': `Bearer ${token}` } : {});
      return fetch(url, opts);
    };

    function applyAuthed(user) {
      if (dropdown) {
        dropdown.style.display = '';
        const nameEl = dropdown.querySelector('.user-name');
        if (nameEl) nameEl.textContent = user.username || user.email || 'Account';
      }
      if (loginBtn) loginBtn.style.display = 'none';
    }
    function applyGuest() {
      if (dropdown) dropdown.style.display = 'none';
      if (loginBtn) loginBtn.style.display = '';
      localStorage.removeItem('user');
      localStorage.removeItem('authToken');
    }

    if (dropdown) dropdown.style.display = 'none'; // hide until we know, avoid flash of wrong state
    const cached = localStorage.getItem('user');
    if (cached) {
      try { applyAuthed(JSON.parse(cached)); } catch (e) {}
    }

    window.authFetch(`${AUTH_BACKEND}/check-auth`)
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) {
          const user = { username: data.username, email: data.email, plan: data.plan };
          localStorage.setItem('user', JSON.stringify(user));
          applyAuthed(user);
        } else {
          applyGuest();
        }
      })
      .catch(() => {});

    // Logout links point at the old Django /logout route, which doesn't exist on
    // this static export — hit the real backend session-logout endpoint instead.
    document.querySelectorAll('a[href="/logout"], a.logout-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        window.authFetch(`${AUTH_BACKEND}/api/logout`, { method: 'POST' })
          .finally(() => {
            localStorage.removeItem('user');
            localStorage.removeItem('authToken');
            window.location.href = 'index.html';
          });
      });
    });
  })();

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    
    const iconMap = {
      success: 'fas fa-check-circle',
      error: 'fas fa-exclamation-circle',
      info: 'fas fa-info-circle'
    };
    
    toast.innerHTML = `
      <i class="${iconMap[type]}"></i>
      <span>${message}</span>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === "dark" ? "light" : "dark";
    body.dataset.theme = currentTheme;
    const icon = document.querySelector("#themeToggle i");
    if (icon) {
      icon.className = currentTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
    }
    localStorage.setItem("theme", currentTheme);
  }
  
  // Set theme on load
  document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "dark";
    document.body.dataset.theme = savedTheme;
    const icon = document.querySelector("#themeToggle i");
    if (icon) {
      icon.className = savedTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
    }
  });
</script>

    <script>
      // Profile page requires a real session — bounce guests to login, then
      // populate the page from the JSON API (this static export has no
      // server-rendered context any more).
      //
      // Any failure here — 401, a network/CORS hiccup, the Render free-tier
      // backend cold-starting and the request timing out — means we can't
      // confirm a session, so treat it the same as "not logged in" and leave.
      // Previously only the clean 401 case redirected; a fetch error just
      // logged a toast and left the page's default markup (Free Plan, ₹0.00
      // shell) sitting on screen forever for a guest.
      document.querySelector('main').style.visibility = 'hidden';

      window.authFetch(`${AUTH_BACKEND}/api/profile`)
        .then(r => {
          if (!r.ok) {
            window.location.href = 'login.html';
            return null;
          }
          return r.json();
        })
        .then(data => {
          if (!data || !data.success) return;

          document.querySelector('main').style.visibility = 'visible';
          document.getElementById('profileUsername').textContent = data.username;
          document.getElementById('profileEmail').textContent = data.email;
          document.getElementById('username').value = data.username;
          document.getElementById('email').value = data.email;
          document.getElementById('planBadge').textContent = `${data.plan} Plan`;
          document.getElementById('planName').textContent = data.plan;
          document.getElementById('planPrice').textContent = data.price;

          const invoiceRows = document.getElementById('invoiceRows');
          if (data.invoices && data.invoices.length) {
            invoiceRows.innerHTML = data.invoices.map(inv => `
              <tr>
                <td style="font-family: monospace; font-weight: 600;">${inv.invoice_number}</td>
                <td>${inv.date}</td>
                <td>₹${inv.amount}</td>
                <td><span class="status-pill status-paid">Paid</span></td>
              </tr>
            `).join('');
          } else {
            invoiceRows.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 1rem; color: var(--text-muted);">No history.</td></tr>';
          }
        })
        .catch(() => {
          window.location.href = 'login.html';
        });

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('profileSaveBtn');
        const msg = document.getElementById('profileSaveMsg');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        try {
          const res = await window.authFetch(`${AUTH_BACKEND}/api/profile-update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value.trim(),
              email: document.getElementById('email').value.trim(),
            }),
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById('profileUsername').textContent = data.username;
            document.getElementById('profileEmail').textContent = data.email;
            const cached = JSON.parse(localStorage.getItem('user') || '{}');
            localStorage.setItem('user', JSON.stringify({ ...cached, username: data.username, email: data.email }));
            showToast('Profile updated!', 'success');
          } else {
            showToast(data.error || 'Update failed.', 'error');
          }
        } catch (err) {
          showToast('Connection error. Please try again.', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Save';
        }
      });
    </script>

</body>
</html>
