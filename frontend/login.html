<script>
  // Dropdown Logic
  document.addEventListener('DOMContentLoaded', () => {
    const trigger = document.getElementById('dropdownTrigger');
    const menu = document.getElementById('dropdownMenu');
    
    if (trigger && menu) {
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('show');
      });

      document.addEventListener('click', (e) => {
        if (!trigger.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove('show');
        }
      });
    }

    // Mobile nav toggle
    const navToggle = document.getElementById('navToggle');
    const navMain = document.getElementById('navMain');
    if (navToggle && navMain) {
      const closeNav = () => {
        navMain.classList.remove('show');
        navToggle.setAttribute('aria-expanded', 'false');
        navToggle.querySelector('i').className = 'fas fa-bars';
      };
      navToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = navMain.classList.toggle('show');
        navToggle.setAttribute('aria-expanded', String(isOpen));
        navToggle.querySelector('i').className = isOpen ? 'fas fa-times' : 'fas fa-bars';
      });
      navMain.querySelectorAll('a').forEach(a => a.addEventListener('click', closeNav));
      document.addEventListener('click', (e) => {
        if (!navToggle.contains(e.target) && !navMain.contains(e.target)) closeNav();
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeNav();
      });
    }
  });

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    
    const iconMap = {
      success: 'fas fa-check-circle',
      error: 'fas fa-exclamation-circle',
      info: 'fas fa-info-circle'
    };
    
    toast.innerHTML = `
      <i class="${iconMap[type]}"></i>
      <span>${message}</span>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === "dark" ? "light" : "dark";
    body.dataset.theme = currentTheme;
    const icon = document.querySelector("#themeToggle i");
    if (icon) {
      icon.className = currentTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
    }
    localStorage.setItem("theme", currentTheme);
  }
  
  // Set theme on load
  document.addEventListener('DOMContentLoaded', () => {

    <script>
      const BACKEND = 'https://hair-scalp-backend.onrender.com';

      const themeToggle = document.getElementById("themeToggle");
      const body = document.body;
      const savedTheme = localStorage.getItem("theme") || "dark";
      body.dataset.theme = savedTheme;
      if (themeToggle) {
        themeToggle.querySelector("i").className = savedTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
        themeToggle.addEventListener("click", () => {
          const t = body.dataset.theme === "dark" ? "light" : "dark";
          body.dataset.theme = t;
          themeToggle.querySelector("i").className = t === "dark" ? "fas fa-sun" : "fas fa-moon";
          localStorage.setItem("theme", t);
        });
      }

      // A stored bearer token is the fallback path for browsers (mobile Chrome
      // in particular) that block the cross-site session cookie outright.
      function authHeaders() {
        const token = localStorage.getItem('authToken');
        return token ? { 'Authorization': `Bearer ${token}` } : {};
      }

      // Check if already logged in
      fetch(`${BACKEND}/check-auth`, { credentials: 'include', headers: authHeaders() })
        .then(r => r.json())
        .then(data => {
          if (data.authenticated) {
            localStorage.setItem('user', JSON.stringify({ username: data.username, email: data.email, plan: data.plan }));
            window.location.href = 'predict.html';
          }
        }).catch(() => {});

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errDiv = document.getElementById('loginError');
        errDiv.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
          const res = await fetch(`${BACKEND}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('user', JSON.stringify({ username: data.username, email: data.email, plan: data.plan }));
            if (data.token) localStorage.setItem('authToken', data.token);
            showToast('Login successful! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
          } else {
            errDiv.textContent = data.error || 'Login failed. Please try again.';
            errDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
          }
        } catch (err) {
          errDiv.textContent = 'Connection error. Please try again.';
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
        }
      });
    </script>
