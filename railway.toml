[build]
builder = "nixpacks"
buildCommand = "chmod +x build.sh && ./build.sh"

[deploy]
startCommand = "cd minor && gunicorn minor.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --max-requests 1000"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PYTHON_VERSION = "3.11"
