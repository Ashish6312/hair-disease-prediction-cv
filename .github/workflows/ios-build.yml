name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios-app/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app/HairScalpAI

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # Always runs, no secrets needed: proves the project actually
      # compiles. Produces an unsigned .app you can drop on the simulator
      # but NOT a device/TestFlight-installable .ipa.
      - name: Build (unsigned, simulator)
        if: ${{ !secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: |
          xcodebuild -project HairScalpAI.xcodeproj \
            -scheme HairScalpAI \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Only runs once the four secrets below are set in the repo
      # (Settings -> Secrets and variables -> Actions):
      #   IOS_DIST_CERT_P12_BASE64      - `base64 -i Distribution.p12`
      #   IOS_DIST_CERT_PASSWORD        - the .p12 export password
      #   IOS_PROVISION_PROFILE_BASE64  - `base64 -i Profile.mobileprovision`
      #   IOS_EXPORT_TEAM_ID            - your 10-char Apple Team ID
      - name: Import signing certificate & profile
        if: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm profile.mobileprovision

      - name: Archive (signed, device)
        if: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        env:
          TEAM_ID: ${{ secrets.IOS_EXPORT_TEAM_ID }}
        run: |
          xcodebuild -project HairScalpAI.xcodeproj \
            -scheme HairScalpAI \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/HairScalpAI.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export .ipa
        if: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        env:
          TEAM_ID: ${{ secrets.IOS_EXPORT_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HairScalpAI.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload .ipa
        if: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: HairScalpAI-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
